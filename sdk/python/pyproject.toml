[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trident-indexer"
version = "0.1.0"
description = "Python client SDK for the Trident Soroban event indexer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Depo-dev" }]
keywords = ["stellar", "soroban", "blockchain", "indexer", "events"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "websocket-client>=1.6",
    "aiohttp>=3.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "types-requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Depo-dev/trident"
Repository = "https://github.com/Depo-dev/trident"
Issues = "https://github.com/Depo-dev/trident/issues"
Documentation = "https://github.com/Depo-dev/trident/blob/main/sdk/python/README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/trident_indexer"]

[tool.hatch.build.targets.sdist]
include = [
    "src/trident_indexer",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.mypy]
python_version = "3.9"
packages = ["trident_indexer"]
mypy_path = "src"
strict = true
warn_unused_configs = true
show_error_codes = true

# websocket-client ships no py.typed marker / stub package (unlike aiohttp and
# websockets, which are inline-typed, and requests, covered by types-requests
# in the dev extra) — without this override `mypy --strict` fails on the
# `import websocket` in client.py before it ever reaches our own code.
[[tool.mypy.overrides]]
module = ["websocket.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/trident_indexer"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
