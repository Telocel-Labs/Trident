# fly/indexer.toml — Trident Stellar event indexer (Rust)
app = "trident-indexer"
primary_region = "iad"

[build]
  dockerfile = "crates/indexer/Dockerfile"

[env]
  POLL_INTERVAL_MS  = "5000"
  INDEX_DIAGNOSTIC  = "false"
  METRICS_PORT      = "9090"
  # crates/indexer/src/health.rs serves /healthz and /readyz on this port,
  # separate from the Prometheus listener on METRICS_PORT (crates/indexer/src/
  # config.rs defaults HEALTH_PORT to 8080 if unset; set explicitly here so the
  # checks below stay in sync with it).
  HEALTH_PORT       = "8080"
  LOG_LEVEL         = "info"

# Secrets are sourced exclusively from Fly's encrypted secrets store
# (set via: fly secrets set -a trident-indexer KEY=value), never from [env].
# Required: DATABASE_URL, REDIS_URL, STELLAR_RPC_URL (or STELLAR_RPC_URLS)
# Optional (defaults to "testnet" if unset — crates/indexer/src/config.rs):
# NETWORK

# No public HTTP or ports — indexer is an internal background worker (issue #778).
# Both the Prometheus metrics listener (9090) and health server (8080) are reachable
# exclusively over Fly's private 6PN mesh (`trident-indexer.internal:9090`).
# Omission of [[services]] and [[services.ports]] guarantees no public IP or listener is bound.

# Readiness and liveness checks:
# Uses Fly's top-level [checks] section which evaluates health directly within the
# private network without requiring or creating public ports.
[checks]
  [checks.readiness]
    type         = "http"
    port         = 8080
    method       = "get"
    path         = "/readyz"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "30s"

  [checks.liveness]
    type         = "http"
    port         = 8080
    method       = "get"
    path         = "/healthz"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
