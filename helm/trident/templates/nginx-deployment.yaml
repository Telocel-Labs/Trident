{{- if .Values.nginx.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trident.fullname" . }}-nginx-config
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      upstream go_api {
        server {{ include "trident.fullname" . }}-go-api:{{ .Values.goApi.service.port }};
      }
      server {
        listen 80;
        # Prometheus metrics are scraped from the go-api's internal metrics
        # port inside the cluster; never proxy them publicly.
        location ~ ^/metrics(/|$) {
          return 404;
        }
        location / {
          proxy_pass         http://go_api;
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;
          proxy_read_timeout 60s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trident.fullname" . }}-nginx
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: {{ .Values.nginx.replicaCount }}
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trident.selectorLabels" (dict "root" . "component" "nginx") | nindent 8 }}
    spec:
      {{- include "trident.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "trident.podSecurityContext" (dict "uid" .Values.nginx.securityContextUid) | nindent 8 }}
      {{- if .Values.nginx.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.nginx.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ .Values.nginx.topologySpreadConstraints.topologyKey }}
          whenUnsatisfiable: {{ .Values.nginx.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "trident.selectorLabels" (dict "root" . "component" "nginx") | nindent 14 }}
      {{- end }}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}{{ if .Values.nginx.image.digest }}@{{ .Values.nginx.image.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "trident.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            # nginx needs to write its pidfile, proxy/cache temp files, and
            # client body buffers — all under paths readOnlyRootFilesystem
            # would otherwise block.
            - name: var-run
              mountPath: /var/run
            - name: var-cache-nginx
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            {{- toYaml .Values.nginx.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.nginx.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "trident.fullname" . }}-nginx-config
        - name: var-run
          emptyDir: {}
        - name: var-cache-nginx
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nginx.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nginx.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nginx.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trident.fullname" . }}-nginx
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  selector:
    {{- include "trident.selectorLabels" (dict "root" . "component" "nginx") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.nginx.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "trident.fullname" . }}-nginx
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  # maxUnavailable (issue #766), not minAvailable: unlike minAvailable,
  # this stays safe to evict from regardless of replicaCount — it never
  # forbids every voluntary disruption outright the way minAvailable: 1
  # did at replicaCount: 1.
  maxUnavailable: {{ .Values.nginx.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "nginx") | nindent 6 }}
{{- end }}
{{- end }}
