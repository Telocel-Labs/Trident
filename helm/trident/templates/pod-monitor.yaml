{{- if and .Values.monitoring.enabled .Values.monitoring.podMonitor.enabled }}
# Issue #768: PodMonitor for Trident Indexer
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "trident.fullname" . }}-indexer
  labels:
    {{- include "trident.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
    {{- with .Values.monitoring.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "trident.selectorLabels" (dict "root" . "component" "indexer") | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.podMonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.monitoring.podMonitor.scrapeTimeout | default "10s" }}
      relabelings:
        - targetLabel: job
          replacement: trident-indexer
{{- end }}
