{{- if .Values.global.externalSecret.enabled }}
# Requires the external-secrets operator (https://external-secrets.io) to be
# installed cluster-wide and a SecretStore/ClusterSecretStore already
# configured (global.externalSecret.secretStoreRef) — this chart does not
# install the operator or provision the backend itself (issue #305).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "trident.fullname" . }}-secrets
  labels:
    {{- include "trident.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.global.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.global.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.global.externalSecret.secretStoreRef.kind }}
  target:
    # Same name every deployment's secretKeyRef already points at
    # (global.existingSecret) — the operator owns/syncs this Secret, no
    # chart change needed on the consuming side.
    name: {{ .Values.global.existingSecret }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.global.externalSecret.data | nindent 4 }}
{{- end }}
