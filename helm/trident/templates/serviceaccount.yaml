{{- if .Values.serviceAccount.create }}
{{- $root := . -}}
{{- range $comp := tuple "nginx" "go-api" "grpc-api" "indexer" "migrate" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "trident.fullname" $root }}-{{ $comp }}
  labels:
    {{- include "trident.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
  {{- with $root.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
