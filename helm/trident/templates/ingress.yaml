{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trident.fullname" . }}
  labels:
    {{- include "trident.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # /internal/ (services/api/handlers/status.go) is cluster-internal
          # only. It has its own X-Internal-Key auth, but this path is listed
          # first and more specific so ingress-nginx matches it before the
          # catch-all "/" below and returns 403 regardless of that check —
          # defense in depth, mirroring docker/nginx/nginx.conf (issue #316,
          # #320). Requires the ingress-nginx controller (the
          # nginx.ingress.kubernetes.io/* annotations below are controller-
          # specific); adapt to an equivalent construct for other controllers.
          - path: /internal/
            pathType: Prefix
            backend:
              service:
                name: {{ include "trident.fullname" . }}-go-api
                port:
                  number: {{ .Values.goApi.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "trident.fullname" . }}-go-api
                port:
                  number: {{ .Values.goApi.service.port }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
