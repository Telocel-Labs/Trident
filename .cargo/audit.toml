# cargo-audit configuration for Trident
#
# Ignore list for the advisories accepted during the #373 triage (closes
# #401). Each entry documents:
#   - The affected dependency and version
#   - Why the advisory is not exploitable in our usage
#   - Date triaged
#   - Review-by date
#
# This list MUST stay in sync with the `[advisories].ignore` table in
# deny.toml so that `cargo audit` and `cargo deny check advisories` agree.
# Advisories fixed by upgrade or replacement are removed from both files.
#
# NOTE: cargo-audit's schema requires `ignore` to be an array of advisory-ID
# strings. The `{ id = "...", reason = "..." }` table form is cargo-deny
# syntax and makes cargo-audit exit with a fatal parse error, so the
# rationale for each entry lives in the comment above it. deny.toml keeps
# the table form, which is correct for that tool.
#
# Review-by date for every entry below: 2026-11-30 (90 days from triage).

[advisories]
ignore = [
    # RUSTSEC-2026-0204 -- crossbeam-epoch (transitive).
    # Invalid pointer dereference in the fmt::Pointer impl; only reachable
    # via Display formatting of Atomic/Shared pointers, which our code never
    # does (fmt::Debug is unaffected). No upstream fix available yet.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0204",

    # RUSTSEC-2023-0071 -- rsa (transitive, Marvin timing sidechannel).
    # Key-recovery attack on RSA private-key operations. Reached only
    # transitively; our code never performs RSA private-key operations, so
    # the vulnerable path is unreachable from our usage.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0049 -- transitive dependency.
    # No fix available; our code does not exercise the affected path.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0049",

    # RUSTSEC-2026-0098 -- transitive dependency (two dependency paths).
    # Affected API is not called by our code; no fix available.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0098",

    # RUSTSEC-2026-0099 -- transitive dependency (two dependency paths).
    # Affected API is not called by our code; no fix available.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0099",

    # RUSTSEC-2026-0104 -- transitive dependency (two dependency paths).
    # Affected API is not called by our code; no fix available.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0190 -- transitive dependency.
    # No fix available; our code does not exercise the affected path.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0190",

    # RUSTSEC-2024-0363 -- sqlx 0.7 (pinned across four workspace crates).
    # Binary protocol misinterpretation caused by truncating casts. The
    # workspace pins sqlx 0.7; upgrading is a semver-major change that needs
    # its own PR (tracked in #373).
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2024-0363",

    # RUSTSEC-2024-0436 -- paste (transitive, unmaintained).
    # Build-time macro with no runtime surface, so no security impact.
    # Replacement tracked separately.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0119 -- transitive dependency.
    # No fix available; our code does not exercise the affected path.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2025-0119",

    # RUSTSEC-2025-0134 -- transitive dependency (two dependency paths).
    # Affected API is not called by our code; no fix available.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0258 -- h2 0.3.27 (via tonic 0.11 -> hyper 0.14 ->
    # opentelemetry-otlp 0.15). Unbounded empty DATA frames. The h2 0.4.x
    # path was upgraded to 0.4.19 and is clean; the 0.3 line has no patched
    # release, so clearing this requires a tonic/opentelemetry major upgrade
    # in its own PR. The affected server path is not exposed by our usage.
    # Triaged 2026-08-30 (#373). Review by 2026-11-30.
    "RUSTSEC-2026-0258",
]
