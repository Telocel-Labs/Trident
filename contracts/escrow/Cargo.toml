[package]
name = "trident-escrow"
version = "0.1.0"
edition = "2021"
description = "Soroban escrow reference contract for Trident indexer testing"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "20.3.2", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "20.3.2", features = ["alloc", "testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
