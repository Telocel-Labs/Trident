events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1000;

    upstream trident_api_upstream {
        server api-1:3001;
        server api-2:3002;
    }

    server {
        listen 80;
        server_name _;

        # Reject cluster-internal status endpoints from public access
        location /internal/ {
            deny all;
            return 403;
        }

        # Main REST API upstream proxying
        location / {
            proxy_pass http://trident_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # WebSocket endpoint with upgrade headers
        location /ws {
            proxy_pass http://trident_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
        }

        # Server-Sent Events (SSE) streaming endpoint
        location /v1/events/stream {
            proxy_pass http://trident_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_set_header X-Accel-Buffering no;
        }
    }
}
