name: Mainnet-Scale Database Benchmark

on:
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      scale:
        description: 'Target table scale: 1m, 5m, 10m (default: 10m)'
        required: false
        default: '10m'
      iterations:
        description: 'Iterations per query sample (default: 20)'
        required: false
        default: '20'

jobs:
  mainnet-scale-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trident
          POSTGRES_PASSWORD: trident_test_password
          POSTGRES_DB: trident
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Run database migrations
        env:
          PGPASSWORD: trident_test_password
        run: |
          echo "Applying database schema and migrations..."
          for file in database/migrations/*.sql; do
            # Skip down migrations
            if [[ "$file" != *".down.sql" ]]; then
              echo "Applying $file..."
              psql -h localhost -U trident -d trident -f "$file"
            fi
          done

      - name: Run mainnet-scale query benchmark
        env:
          DATABASE_URL: postgres://trident:trident_test_password@localhost:5432/trident
          SCALE: ${{ github.event.inputs.scale || '10m' }}
          ITERATIONS: ${{ github.event.inputs.iterations || '20' }}
        run: |
          python load-tests/mainnet_scale_benchmark.py \
            --db-url "$DATABASE_URL" \
            --scale "$SCALE" \
            --iterations "$ITERATIONS" \
            --output "load-tests/mainnet-scale-benchmark-results.json" \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-scale-benchmark-results
          path: load-tests/mainnet-scale-benchmark-results.json
          retention-days: 30

      - name: Notify on benchmark failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const message = `⚠️ **Mainnet-Scale Database Benchmark failed!**\n\n` +
              `Workflow run: ${runUrl}\n` +
              `Triggered by: \`${context.eventName}\`\n\n` +
              `Query latency regressed or forbidden Seq Scans were detected on tables sized in tens of millions of rows (10M+).\n` +
              `Please inspect the artifact and database query plans.`;

            if (context.issue && context.issue.number) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            } else {
              console.log(message);
            }
