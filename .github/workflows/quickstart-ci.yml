name: Quickstart CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  verify-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # The sample imports @trident-indexer/sdk, so the SDK's declarations
      # must exist before it can be type-checked. Building it here means the
      # check verifies the sample against the SDK's real surface rather than
      # just parsing it.
      - name: Build the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build

      - name: Validate Quickstart Code Samples
        working-directory: docs/site/examples
        run: |
          echo "Type-checking the quickstart sample against the SDK..."
          # -p typescript, not a bare `npx tsc`: npx resolves `tsc` to the
          # unrelated, abandoned `tsc@2.0.4` package, which prints "This is
          # not the tsc command you are looking for" and exits 1.
          #
          # tsconfig.json here maps @trident-indexer/sdk to the declarations
          # built in the previous step and sets an ES2020 target, so the
          # sample is checked against the SDK's real surface (the default ES5
          # target has no Promise, so every async sample failed to compile).
          npx -y -p typescript@5 tsc --noEmit -p tsconfig.json
