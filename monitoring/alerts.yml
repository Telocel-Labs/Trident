groups:
  - name: TridentPartitions
    rules:
      - alert: TridentPartitionExhaustionSoon
        expr: | 
          (select count(*) from pg_partition_meta where partition_name like 'events_%' and upper_bound < now() + interval '7 days') > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Newest partition is within 7 days of its bound"
          description: "The events table is nearing its partition bound. Ensure ensure_future_event_partitions(3) is running."

      - alert: TridentPartitionExhaustionCritical
        expr: | 
          (select count(*) from pg_partition_meta where partition_name like 'events_%' and upper_bound < now() + interval '2 days') > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Newest partition is within 2 days of its bound"
          description: "Partition exhaustion is imminent. Hard ingestion failure will occur shortly."