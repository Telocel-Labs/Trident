groups:
  - name: trident-partitions
    rules:
      - alert: TridentPartitionExhaustionSoon
        expr: trident_indexer_partition_days_remaining < 7
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Events table partition is running out of future bounds"
          description: "The newest events table partition ends in less than 7 days. Ensure automated partition management is running or manually run the partition creation script."

      - alert: TridentPartitionExhaustionCritical
        expr: trident_indexer_partition_days_remaining < 2
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Events table partition exhausting imminently"
          description: "The newest events table partition ends in less than 2 days. Inserts will fail once bounds are reached."
